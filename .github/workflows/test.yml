name: Website BDD Tests & Health Monitor

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Run daily health check at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test-and-monitor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Project Dependencies
        run: uv sync

      - name: Install Playwright Browsers & System Dependencies
        run: uv run playwright install --with-deps ${{ matrix.browser }}

      - name: Basic Task - Syntax & Feature Validation
        run: |
          echo "Running Python syntax validation..."
          uv run python -m py_compile pages/*.py features/steps/*.py scripts/*.py
          echo "Validating Gherkin feature files syntax..."
          uv run python -c "
          import glob
          from behave.parser import parse_file
          for f in glob.glob('features/*.feature'):
              feature = parse_file(f)
              print(f'✓ Valid: {f} ({feature.name})')
          "

      - name: Run BDD Test Suite (${{ matrix.browser }})
        id: run_tests
        run: |
          mkdir -p reports screenshots
          set -o pipefail
          uv run behave -D browser=${{ matrix.browser }} -f behave_html_formatter:HTMLFormatter -o reports/report-${{ matrix.browser }}.html -f pretty 2>&1 | tee test-output.log

      - name: Upload Test Report & Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.browser }}
          path: |
            reports/
            screenshots/
            test-output.log

      - name: Automatically Resolve & Close Existing GitHub Issue on Recovery
        if: success()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python scripts/resolve_issue.py

      - name: Automatically Report Failure to GitHub Issues
        if: failure()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python scripts/create_issue.py
